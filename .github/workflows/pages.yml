name: Publicar PWA y actualizar catálogo de pruebas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: |
          mkdir -p dist
          cp index.html app.js style.css sw.js manifest.webmanifest version.json dist/
          touch dist/.nojekyll
          python scripts/catalog.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Esperar a que el paquete esté disponible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          name = 'github-pages-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          for attempt in range(8):
              with urllib.request.urlopen(request, timeout=30) as response:
                  artifacts = json.load(response)['artifacts']
              if sum(a['name'] == name and not a['expired'] for a in artifacts) == 1:
                  print('Paquete de publicación confirmado.')
                  time.sleep(15)
                  break
              time.sleep(10)
          else:
              raise RuntimeError('El paquete de publicación no está disponible.')
          PY
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
